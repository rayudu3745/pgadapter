on:
  pull_request:
  # TEMPORARY (windows-psql-ci experiment only) - revert before merging.
  push:
    branches:
      - windows-psql-ci
name: units
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: ${{matrix.java}}
      - run: java -version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - run: go version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python --version
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer
      - run: php --version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - run: mvn -Dpgadapter.use_virtual_threads=true -Dpgadapter.use_virtual_grpc_transport_threads=true -B test -Ptest-all -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
  windows:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: ${{matrix.java}}
      - run: java -version
      # The runner image ships PostgreSQL but only puts its root directory on PATH, so psql is not
      # found and every psql-gated test silently skips on Windows.
      - name: Add psql to PATH
        shell: pwsh
        run: echo "$env:PGBIN" >> $env:GITHUB_PATH
      - name: Verify psql is available
        shell: pwsh
        run: psql --version
      - run: mvn -B test
      # TEMPORARY (windows-psql-ci experiment only): encode the result in the job status, since a
      # skipped test would otherwise still report as a pass.
      - name: Assert psql-gated tests actually ran
        if: always()
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path target/surefire-reports -Filter '*SpannerPGConnectorMockServerTest*.xml' -ErrorAction SilentlyContinue
          if (-not $files) { throw 'FAIL: no surefire report for SpannerPGConnectorMockServerTest' }
          [xml]$x = Get-Content $files[0].FullName
          $t = [int]$x.testsuite.tests
          $s = [int]$x.testsuite.skipped
          Write-Host "SpannerPGConnectorMockServerTest tests=$t skipped=$s"
          if ($t -eq 0) { throw 'FAIL: no tests in class' }
          if ($s -gt 0) { throw "FAIL: $s test(s) still skipped on Windows" }
          Write-Host 'OK: connector psql tests ran on Windows'
  macos:
    runs-on: macos-latest
    env:
      DOTNET_NOLOGO: true
      HOMEBREW_NO_SANDBOX: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install coreutils
        run: brew install coreutils
      - name: install postgresql
        run: brew install postgresql
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: ${{matrix.java}}
      - run: java -version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - run: go version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python --version
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer
      - run: php --version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '6.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - run: mvn -B test -Ptest-all -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
